name: 알림 다이제스트 발송

# 무료 호스팅은 접속이 없으면 서버를 재운다. 서버 안의 시계는 그 시간을 그냥 흘려보내므로
# 여기서 매시 정각에 두드려 깨운다. api의 ENABLE_CRON=false 와 짝을 이룬다.
on:
  schedule:
    # UTC 기준 매시 정각. 사용자별 타임존 비교는 서버가 한다.
    - cron: '0 * * * *'
  # 눌러서 바로 확인해볼 수 있게 해둔다.
  workflow_dispatch:

# 앞선 실행이 늦어지면 겹치지 않게 한 번에 하나만 돈다.
concurrency:
  group: dispatch-digests
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 배치 호출
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::API_URL 과 CRON_SECRET 시크릿을 저장소 설정에 추가하세요."
            exit 1
          fi

          # 무료 호스팅은 자고 있다 깨어나는 데 시간이 걸린다. 넉넉히 기다린다.
          response=$(curl -sS -X POST "$API_URL/v1/internal/dispatch-digests" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120 --retry 2 --retry-delay 20 --retry-connrefused \
            -w '\n%{http_code}')

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "응답: $body"

          if [ "$status" != "200" ]; then
            echo "::error::배치 호출 실패 (HTTP $status)"
            exit 1
          fi

          echo "### 알림 다이제스트" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
