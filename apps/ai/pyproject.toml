[project]
name = "lastly-ai"
version = "0.1.0"
description = "Lastly AI 서비스 — 자연어 해석, 항목 매칭, 주기 추론"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "anthropic>=0.68.0",
    "asyncpg>=0.29.0",
    "numpy>=2.1.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.9", "mypy>=1.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastly_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# B008 — FastAPI 는 Depends() 를 인자 기본값에 두는 것이 정해진 사용법이다.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

# asyncpg 는 py.typed 를 배포하지 않는다. 이 모듈만 예외로 둔다.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
