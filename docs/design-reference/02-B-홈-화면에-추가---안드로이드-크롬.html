<!doctype html>
<meta charset="utf-8">
<title>02-B · 홈 화면에 추가 — 안드로이드 · 크롬</title>
<style>
  :root{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --accent:#4A433F; --accent-soft:#F7EDE6; --accent-ink:#9A4F31;
    --sage:#D4836A; --sage-soft:#FAF0EA;
    --ink:#2D2622; --ink-2:#5A534C; --ink-3:#6A6259;
    --paper:#F5F2EC; --card:#FBF9F4; --line:#E6E0D4;
    --label-display:block; --paper-tex:none;
  }
  @keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes caret{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    18%{box-shadow:0 0 0 2px rgba(168,95,68,.85),0 0 26px 7px rgba(168,95,68,.30),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    34%{box-shadow:0 0 0 1.5px rgba(168,95,68,.55),0 0 14px 2px rgba(168,95,68,.18),0 12px 26px rgba(70,58,44,.08);border-color:#D9A87F;}
    52%{box-shadow:0 0 0 2.5px rgba(168,95,68,.95),0 0 34px 10px rgba(168,95,68,.36),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    68%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 12px 2px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    84%{box-shadow:0 0 0 2px rgba(168,95,68,.8),0 0 24px 6px rgba(168,95,68,.26),0 12px 26px rgba(70,58,44,.08);border-color:#C98A54;}
    100%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
  html,body{margin:0;padding:0;}
  body{background:#EAE5DA;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);text-decoration:none;}
  a:hover{color:#0062CC;}
</style>
<body style="margin:0;padding:40px;background:#EDE8DF;font-family:'Pretendard',-apple-system,system-ui,sans-serif;">
<div style="--label-display:block;">
<!-- 02-B 안드로이드 -->
    <div style="flex:0 0 auto;width:390px;">
      <div style="display:var(--label-display);font-size:13px;letter-spacing:.04em;color:#5F584F;margin-bottom:14px;padding-left:6px;">02-B · 홈 화면에 추가 — 안드로이드 · 크롬</div>
      <div style="width:390px;height:844px;background:var(--paper);background-image:var(--paper-tex);border:1px solid #E6E0D4;border-radius:46px;box-shadow:0 24px 60px rgba(70,58,44,.13),0 2px 6px rgba(70,58,44,.05);overflow:hidden;display:flex;flex-direction:column;">
        <div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;flex:0 0 auto;">
          <span>9:41</span><span style="width:16px;height:9px;border:1.5px solid var(--ink);border-radius:3px;display:block;"></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;padding:34px 32px 38px;box-sizing:border-box;">
          <div style="display:flex;gap:6px;margin-bottom:24px;">
            <span style="width:26px;height:4px;border-radius:2px;background:var(--line);display:block;"></span>
            <span style="width:26px;height:4px;border-radius:2px;background:var(--accent);display:block;"></span>
            <span style="width:26px;height:4px;border-radius:2px;background:var(--line);display:block;"></span>
          </div>
          <h2 style="font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.45;margin:0;">알림을 받으려면<br />홈 화면에 추가해 주세요</h2>
          <p style="margin:12px 0 0;font-size:14.5px;line-height:1.75;color:var(--ink-2);">크롬 메뉴에서 한 번만 추가해두면<br />앱처럼 바로 열리고 알림도 받을 수 있어요.</p>

          <div style="margin-top:18px;display:flex;gap:5px;background:#E6E0D4;border-radius:14px;padding:4px;">
            <span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13.5px;font-weight:600;color:#5A534C;">아이폰 · 사파리</span>
            <span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;background:#FFFFFF;font-size:13.5px;font-weight:700;box-shadow:0 1px 2px rgba(70,58,44,.08);">안드로이드 · 크롬</span>
          </div>

          <div style="margin-top:22px;display:flex;flex-direction:column;gap:18px;">
            <div style="display:flex;gap:13px;align-items:flex-start;">
              <span style="flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</span>
              <div style="flex:1;">
                <div style="font-size:15px;font-weight:600;margin-bottom:11px;">주소창 오른쪽 <span style="color:var(--accent-ink);">메뉴 버튼</span>을 눌러요</div>
                <div style="background:var(--card);border:1px solid var(--line);border-radius:22px;padding:13px 14px;box-shadow:0 4px 16px rgba(70,58,44,.04);display:flex;align-items:center;gap:12px;">
                  <span style="flex:1;height:32px;border-radius:16px;background:#F3EFE6;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--ink-3);box-sizing:border-box;">majimak.app</span>
                  <span style="width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:0 0 auto;">
                    <span style="width:3.5px;height:3.5px;border-radius:50%;background:var(--accent-ink);display:block;"></span>
                    <span style="width:3.5px;height:3.5px;border-radius:50%;background:var(--accent-ink);display:block;"></span>
                    <span style="width:3.5px;height:3.5px;border-radius:50%;background:var(--accent-ink);display:block;"></span>
                  </span>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:13px;align-items:flex-start;">
              <span style="flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</span>
              <div style="flex:1;">
                <div style="font-size:15px;font-weight:600;margin-bottom:11px;">메뉴에서 <span style="color:var(--accent-ink);">홈 화면에 추가</span>를 골라요</div>
                <div style="background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 4px 16px rgba(70,58,44,.04);">
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:14px;color:var(--ink-3);border-bottom:1px solid var(--line);">
                    <span>새 탭</span>
                  </div>
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);">
                    <span>홈 화면에 추가</span>
                    <span style="position:relative;width:19px;height:19px;border:1.6px solid var(--accent-ink);border-radius:6px;display:block;">
                      <span style="position:absolute;top:8px;left:3.5px;width:10px;height:1.6px;background:var(--accent-ink);display:block;"></span>
                      <span style="position:absolute;left:8px;top:3.5px;height:10px;width:1.6px;background:var(--accent-ink);display:block;"></span>
                    </span>
                  </div>
                  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:14px;color:var(--ink-3);border-top:1px solid var(--line);">
                    <span>북마크</span>
                  </div>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:9px;align-items:flex-start;padding:0 2px;">
              <span style="width:6px;height:6px;border-radius:50%;background:var(--sage);margin-top:7px;display:block;flex:0 0 auto;"></span>
              <span style="font-size:13.5px;line-height:1.7;color:var(--ink-2);">“앱 설치” 안내가 바로 뜨면 그것만 눌러도 돼요.</span>
            </div>
          </div>

          <div style="margin-top:auto;">
            <div style="background:#A85F44;color:#FFFFFF;border-radius:20px;height:58px;box-shadow:0 8px 18px rgba(168,95,68,.26);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;">추가했어요</div>
            <div style="text-align:center;margin-top:18px;font-size:14px;color:var(--ink-3);">나중에 하기</div>
          </div>
        </div>
      </div>
    </div>
</div>
</body>
