<!doctype html>
<meta charset="utf-8">
<title>01 · 온보딩 — 소개</title>
<style>
  :root{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --accent:#4A433F; --accent-soft:#F7EDE6; --accent-ink:#9A4F31;
    --sage:#D4836A; --sage-soft:#FAF0EA;
    --ink:#2D2622; --ink-2:#5A534C; --ink-3:#6A6259;
    --paper:#F5F2EC; --card:#FBF9F4; --line:#E6E0D4;
    --label-display:block; --paper-tex:none;
  }
  @keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes caret{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    18%{box-shadow:0 0 0 2px rgba(168,95,68,.85),0 0 26px 7px rgba(168,95,68,.30),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    34%{box-shadow:0 0 0 1.5px rgba(168,95,68,.55),0 0 14px 2px rgba(168,95,68,.18),0 12px 26px rgba(70,58,44,.08);border-color:#D9A87F;}
    52%{box-shadow:0 0 0 2.5px rgba(168,95,68,.95),0 0 34px 10px rgba(168,95,68,.36),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    68%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 12px 2px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    84%{box-shadow:0 0 0 2px rgba(168,95,68,.8),0 0 24px 6px rgba(168,95,68,.26),0 12px 26px rgba(70,58,44,.08);border-color:#C98A54;}
    100%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
  html,body{margin:0;padding:0;}
  body{background:#EAE5DA;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);text-decoration:none;}
  a:hover{color:#0062CC;}
</style>
<body style="margin:0;padding:40px;background:#EDE8DF;font-family:'Pretendard',-apple-system,system-ui,sans-serif;">
<div style="--label-display:block;">
<!-- 01 온보딩 소개 -->
    <div style="flex:0 0 auto;width:390px;">
      <div style="display:var(--label-display);font-size:13px;letter-spacing:.04em;color:#5F584F;margin-bottom:14px;padding-left:6px;">01 · 온보딩 — 소개</div>
      <div style="width:390px;height:844px;background:var(--paper);background-image:var(--paper-tex);border:1px solid #E6E0D4;border-radius:46px;box-shadow:0 24px 60px rgba(70,58,44,.13),0 2px 6px rgba(70,58,44,.05);overflow:hidden;display:flex;flex-direction:column;">
        <div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;flex:0 0 auto;">
          <span>9:41</span><span style="width:16px;height:9px;border:1.5px solid var(--ink);border-radius:3px;display:block;"></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;padding:52px 32px 40px;box-sizing:border-box;">
          <div style="font-size:13px;letter-spacing:.16em;font-weight:700;color:var(--accent-ink);">LASTLY</div>
          <h2 style="font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1.42;margin:26px 0 0;">마지막으로 언제 했는지<br />기억해주는 앱</h2>
          <p style="margin:18px 0 0;font-size:15.5px;line-height:1.8;color:var(--ink-2);">“오늘 이불 빨았어”처럼 한 줄만 적으면,<br />다음 알림일까지 알아서 척척 계산해드려요.</p>

          <div style="margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 20px;box-shadow:0 6px 20px rgba(70,58,44,.05);">
            <div style="display:flex;gap:14px;align-items:flex-start;padding:16px 2px;border-bottom:1px solid var(--line);">
              <span style="flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">1</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:16px;font-weight:600;letter-spacing:-.025em;">한 문장으로 기록</div>
                <div style="font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:5px;word-break:keep-all;">말하거나 적으면 항목과 날짜를 알아서 정리해요.</div>
              </div>
            </div>
            <div style="display:flex;gap:14px;align-items:flex-start;padding:16px 2px;border-bottom:1px solid var(--line);">
              <span style="flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">2</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:16px;font-weight:600;letter-spacing:-.025em;">주기는 자동 계산</div>
                <div style="font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:5px;word-break:keep-all;">지금까지 해온 간격을 보고 다음 시점을 잡아드려요.</div>
              </div>
            </div>
            <div style="display:flex;gap:14px;align-items:flex-start;padding:16px 2px;">
              <span style="flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;">3</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:16px;font-weight:600;letter-spacing:-.025em;">때가 되면 조용히 알림</div>
                <div style="font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-top:5px;word-break:keep-all;">재촉하지 않고 알맞은 때에 한 번만 알려드려요.</div>
              </div>
            </div>
          </div>

          <div style="margin-top:auto;">
            <div style="background:#A85F44;color:#FFFFFF;border-radius:20px;height:58px;box-shadow:0 8px 18px rgba(168,95,68,.22);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;">시작하기</div>
            <div style="text-align:center;margin-top:18px;font-size:14px;color:var(--ink-3);">이미 쓰고 있어요</div>
          </div>
        </div>
      </div>
    </div>
</div>
</body>
