<!doctype html>
<meta charset="utf-8">
<title>10-B · 직접 입력 — 반복 패턴 상세</title>
<style>
  :root{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --accent:#4A433F; --accent-soft:#F7EDE6; --accent-ink:#9A4F31;
    --sage:#D4836A; --sage-soft:#FAF0EA;
    --ink:#2D2622; --ink-2:#5A534C; --ink-3:#6A6259;
    --paper:#F5F2EC; --card:#FBF9F4; --line:#E6E0D4;
    --label-display:block; --paper-tex:none;
  }
  @keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes caret{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    18%{box-shadow:0 0 0 2px rgba(168,95,68,.85),0 0 26px 7px rgba(168,95,68,.30),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    34%{box-shadow:0 0 0 1.5px rgba(168,95,68,.55),0 0 14px 2px rgba(168,95,68,.18),0 12px 26px rgba(70,58,44,.08);border-color:#D9A87F;}
    52%{box-shadow:0 0 0 2.5px rgba(168,95,68,.95),0 0 34px 10px rgba(168,95,68,.36),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    68%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 12px 2px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    84%{box-shadow:0 0 0 2px rgba(168,95,68,.8),0 0 24px 6px rgba(168,95,68,.26),0 12px 26px rgba(70,58,44,.08);border-color:#C98A54;}
    100%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
  html,body{margin:0;padding:0;}
  body{background:#EAE5DA;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);text-decoration:none;}
  a:hover{color:#0062CC;}
</style>
<body style="margin:0;padding:40px;background:#EDE8DF;font-family:'Pretendard',-apple-system,system-ui,sans-serif;">
<div style="--label-display:block;">
<!-- 10-B 상세 주기 -->
    <div style="flex:0 0 auto;width:390px;">
      <div style="display:var(--label-display);font-size:13px;letter-spacing:.04em;color:#5F584F;margin-bottom:14px;padding-left:6px;">10-B · 직접 입력 — 반복 패턴 상세</div>
      <div style="width:390px;height:844px;background:var(--paper);background-image:var(--paper-tex);border:1px solid #E6E0D4;border-radius:46px;box-shadow:0 24px 60px rgba(70,58,44,.13),0 2px 6px rgba(70,58,44,.05);overflow:hidden;display:flex;flex-direction:column;position:relative;">
        <div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;flex:0 0 auto;">
          <span>9:41</span><span style="width:16px;height:9px;border:1.5px solid var(--ink);border-radius:3px;display:block;"></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;padding:18px 24px 0;box-sizing:border-box;opacity:.3;">
          <div style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);">9월 6일 일요일 · 지현님</div>
          <div style="font-size:23px;font-weight:700;letter-spacing:-.035em;margin-top:5px;">오늘 챙길 가사 2개</div>
          <div style="margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:26px;height:150px;"></div>
          <div style="margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;height:130px;"></div>
        </div>
        <div style="position:absolute;inset:0;background:rgba(45,38,34,.26);"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(251,249,244,.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:30px 30px 46px 46px;padding:12px 24px 26px;box-shadow:0 -1px 0 var(--line);">
          <div style="height:5px;width:44px;border-radius:3px;background:#CBC2B2;margin:0 auto 18px;"></div>
          <div style="display:flex;align-items:center;">
            <span style="font-size:14px;color:var(--ink-3);">뒤로</span>
            <span style="margin-left:auto;font-size:19px;font-weight:700;letter-spacing:-.03em;">직접 입력</span>
            <span style="margin-left:auto;font-size:14px;color:var(--ink-3);">닫기</span>
          </div>

          <div style="margin-top:20px;font-size:12.5px;letter-spacing:.04em;color:var(--ink-3);">반복 방식</div>
          <div style="margin-top:8px;display:flex;gap:5px;background:#F3EFE6;border-radius:14px;padding:4px;">
            <span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink-3);">일 단위</span>
            <span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;background:var(--card);font-size:13.5px;font-weight:700;box-shadow:0 1px 2px rgba(70,58,44,.08);">주 단위</span>
            <span style="flex:1;text-align:center;padding:9px 0;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--ink-3);">월 단위</span>
          </div>

          <div style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;">
            <span style="font-size:15.5px;font-weight:600;">몇 주마다</span>
            <span style="display:flex;align-items:center;gap:16px;">
              <span style="width:32px;height:32px;border-radius:10px;background:#F3EFE6;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink-2);">−</span>
              <span style="font-size:19px;font-weight:700;letter-spacing:-.03em;min-width:24px;text-align:center;">2</span>
              <span style="width:32px;height:32px;border-radius:10px;background:#F3EFE6;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink-2);">+</span>
            </span>
          </div>

          <div style="margin-top:18px;font-size:12.5px;letter-spacing:.04em;color:var(--ink-3);">요일 (선택)</div>
          <div style="margin-top:8px;display:flex;gap:6px;">
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">월</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">화</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">수</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">목</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">금</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1.5px solid #A85F44;color:#9A4F31;background:#F7EDE6;font-size:13.5px;font-weight:700;">토</span>
            <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-3);">일</span>
          </div>

          <div style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;">
            <div>
              <div style="font-size:15.5px;font-weight:600;">알림 시간</div>
              <div style="font-size:12.5px;color:var(--ink-3);margin-top:3px;">이 항목만 따로 설정</div>
            </div>
            <span style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;">오전 10:00<span style="width:7px;height:7px;border-right:1.6px solid var(--ink-3);border-top:1.6px solid var(--ink-3);transform:rotate(45deg);display:block;"></span></span>
          </div>

          <div style="margin-top:16px;background:#F3EFE6;border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:var(--ink-2);">2주마다 <strong style="font-weight:700;color:var(--ink);">토요일 오전 10시</strong>에 알려드릴게요<br />다음 알림 · 9월 19일 (토)</div>

          <div style="margin-top:18px;background:#A85F44;color:#FFFFFF;border-radius:20px;height:56px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;box-shadow:0 8px 18px rgba(168,95,68,.26);">이 주기로 저장</div>
          <div style="height:5px;width:130px;border-radius:3px;background:#E1D9CB;margin:16px auto 0;"></div>
        </div>
      </div>
    </div>
</div>
</body>
