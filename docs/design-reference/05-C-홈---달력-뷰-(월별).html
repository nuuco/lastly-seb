              <span style="flex:1;font-size:15px;font-weight:600;">에어컨 필터 청소</span>
              <span style="font-size:12.5px;font-weight:700;color:#A85F44;">오늘 예정</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;padding:13px 2px;">
              <span style="flex:1;font-size:15px;font-weight:600;color:var(--ink-2);">욕실 배수구 청소</span>
              <span style="font-size:12.5px;font-weight:700;color:#B3402C;">2일 밀림</span>
            </div>
          </div>
        </div>
        <div style="flex:0 0 auto;padding:14px 22px 26px;background:linear-gradient(180deg,rgba(245,242,236,0),var(--paper) 34%);">
          <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:24px;padding:8px 8px 8px 20px;box-shadow:0 -1px 0 rgba(70,58,44,.04);">
            <span style="flex:1;font-size:15.5px;color:var(--ink-3);">말하거나 적어보세요</span>
            <span style="position:relative;width:46px;height:46px;border-radius:16px;background:linear-gradient(180deg,#5A534E,#4A433F);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 16px rgba(44,38,35,.3);">
              <span style="width:11px;height:18px;border-radius:6px;background:#FFFFFF;display:block;"></span>
              <span style="position:absolute;bottom:11px;width:19px;height:9px;border:2px solid #FFFFFF;border-top:none;border-radius:0 0 10px 10px;display:block;"></span>
            </span>
          </div>
          <div style="height:5px;width:130px;border-radius:3px;background:#E1D9CB;margin:18px auto 0;"></div>
        </div>
      </div>
    </div>
</div>
