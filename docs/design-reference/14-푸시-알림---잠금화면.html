<!doctype html>
<meta charset="utf-8">
<title>14 · 푸시 알림 — 잠금화면</title>
<style>
  :root{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --accent:#4A433F; --accent-soft:#F7EDE6; --accent-ink:#9A4F31;
    --sage:#D4836A; --sage-soft:#FAF0EA;
    --ink:#2D2622; --ink-2:#5A534C; --ink-3:#6A6259;
    --paper:#F5F2EC; --card:#FBF9F4; --line:#E6E0D4;
    --label-display:block; --paper-tex:none;
  }
  @keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes caret{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    18%{box-shadow:0 0 0 2px rgba(168,95,68,.85),0 0 26px 7px rgba(168,95,68,.30),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    34%{box-shadow:0 0 0 1.5px rgba(168,95,68,.55),0 0 14px 2px rgba(168,95,68,.18),0 12px 26px rgba(70,58,44,.08);border-color:#D9A87F;}
    52%{box-shadow:0 0 0 2.5px rgba(168,95,68,.95),0 0 34px 10px rgba(168,95,68,.36),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    68%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 12px 2px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    84%{box-shadow:0 0 0 2px rgba(168,95,68,.8),0 0 24px 6px rgba(168,95,68,.26),0 12px 26px rgba(70,58,44,.08);border-color:#C98A54;}
    100%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
  html,body{margin:0;padding:0;}
  body{background:#EAE5DA;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);text-decoration:none;}
  a:hover{color:#0062CC;}
</style>
<body style="margin:0;padding:40px;background:#EDE8DF;font-family:'Pretendard',-apple-system,system-ui,sans-serif;">
<div style="--label-display:block;">
<!-- 14 푸시 알림 -->
    <div style="flex:0 0 auto;width:390px;">
      <div style="display:var(--label-display);font-size:13px;letter-spacing:.04em;color:#5F584F;margin-bottom:14px;padding-left:6px;">14 · 푸시 알림 — 잠금화면</div>
      <div style="width:390px;height:844px;background:#EAE5DA;background-image:var(--paper-tex);border:1px solid #E6E0D4;border-radius:46px;box-shadow:0 24px 60px rgba(70,58,44,.13),0 2px 6px rgba(70,58,44,.05);overflow:hidden;display:flex;flex-direction:column;">
        <div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;color:#2D2622;flex:0 0 auto;">
          <span>9:41</span><span style="width:16px;height:9px;border:1.5px solid #2D2622;border-radius:3px;display:block;"></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;padding:34px 20px 28px;box-sizing:border-box;">
          <div style="text-align:center;color:#6C6B66;">
            <div style="font-size:15px;letter-spacing:.04em;color:#544E47;">9월 8일 화요일</div>
            <div style="font-size:78px;font-weight:600;letter-spacing:-.05em;line-height:1.05;margin-top:2px;color:#2D2622;">9:41</div>
          </div>

          <div style="margin-top:36px;display:flex;flex-direction:column;gap:10px;">
            <div style="background:rgba(255,255,255,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:22px;padding:17px 19px;">
              <div style="display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3);margin-bottom:10px;">
                <span style="width:17px;height:17px;border-radius:6px;background:var(--accent);display:block;"></span>
                <span style="font-weight:600;color:var(--ink-2);">Lastly</span><span style="margin-left:auto;">지금</span>
              </div>
              <div style="font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;">이불 빨래할 때가 됐어요</div>
              <div style="font-size:13.5px;color:var(--ink-2);">마지막 세탁 14일 전 · 8월 25일</div>
              <div style="display:flex;gap:8px;margin-top:15px;">
                <span style="flex:1;text-align:center;padding:14px 0;border-radius:13px;background:var(--accent);color:#FFFFFF;font-size:14px;font-weight:600;">완료</span>
                <span style="flex:1;text-align:center;padding:14px 0;border-radius:13px;background:#F3EFE6;color:var(--ink-2);font-size:14px;font-weight:600;">3일 뒤에</span>
                <span style="flex:1;text-align:center;padding:14px 0;border-radius:13px;background:#F3EFE6;color:var(--ink-2);font-size:14px;font-weight:600;">주말에</span>
              </div>
            </div>
            <div style="background:rgba(255,255,255,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;padding:14px 19px;">
              <div style="display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3);">
                <span style="width:15px;height:15px;border-radius:5px;background:#E1D9CB;display:block;"></span>
                <span style="color:var(--ink-2);">Lastly</span><span style="margin-left:auto;">어제</span>
              </div>
              <div style="font-size:14px;margin-top:8px;color:var(--ink-2);">에어컨 필터 청소를 미뤄뒀어요</div>
            </div>
          </div>

          <div style="margin-top:auto;text-align:center;">
            <div style="font-size:13px;color:#6E665D;">밀어서 열기</div>
            <div style="height:5px;width:130px;border-radius:3px;background:#E1D9CB;margin:18px auto 0;"></div>
          </div>
        </div>
      </div>
    </div>
</div>
</body>
