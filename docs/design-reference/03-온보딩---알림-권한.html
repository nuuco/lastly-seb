<!doctype html>
<meta charset="utf-8">
<title>03 · 온보딩 — 알림 권한</title>
<style>
  :root{
    --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --accent:#4A433F; --accent-soft:#F7EDE6; --accent-ink:#9A4F31;
    --sage:#D4836A; --sage-soft:#FAF0EA;
    --ink:#2D2622; --ink-2:#5A534C; --ink-3:#6A6259;
    --paper:#F5F2EC; --card:#FBF9F4; --line:#E6E0D4;
    --label-display:block; --paper-tex:none;
  }
  @keyframes wv{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
  @keyframes caret{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{
    0%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    18%{box-shadow:0 0 0 2px rgba(168,95,68,.85),0 0 26px 7px rgba(168,95,68,.30),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    34%{box-shadow:0 0 0 1.5px rgba(168,95,68,.55),0 0 14px 2px rgba(168,95,68,.18),0 12px 26px rgba(70,58,44,.08);border-color:#D9A87F;}
    52%{box-shadow:0 0 0 2.5px rgba(168,95,68,.95),0 0 34px 10px rgba(168,95,68,.36),0 12px 26px rgba(70,58,44,.08);border-color:#A85F44;}
    68%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 12px 2px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
    84%{box-shadow:0 0 0 2px rgba(168,95,68,.8),0 0 24px 6px rgba(168,95,68,.26),0 12px 26px rgba(70,58,44,.08);border-color:#C98A54;}
    100%{box-shadow:0 0 0 1.5px rgba(168,95,68,.5),0 0 10px 1px rgba(168,95,68,.16),0 12px 26px rgba(70,58,44,.08);border-color:#E0BFA6;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
  html,body{margin:0;padding:0;}
  body{background:#EAE5DA;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent-ink);text-decoration:none;}
  a:hover{color:#0062CC;}
</style>
<body style="margin:0;padding:40px;background:#EDE8DF;font-family:'Pretendard',-apple-system,system-ui,sans-serif;">
<div style="--label-display:block;">
<!-- 03 알림 권한 -->
    <div style="flex:0 0 auto;width:390px;">
      <div style="display:var(--label-display);font-size:13px;letter-spacing:.04em;color:#5F584F;margin-bottom:14px;padding-left:6px;">03 · 온보딩 — 알림 권한</div>
      <div style="width:390px;height:844px;background:var(--paper);background-image:var(--paper-tex);border:1px solid #E6E0D4;border-radius:46px;box-shadow:0 24px 60px rgba(70,58,44,.13),0 2px 6px rgba(70,58,44,.05);overflow:hidden;display:flex;flex-direction:column;">
        <div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:14px;font-weight:600;flex:0 0 auto;">
          <span>9:41</span><span style="width:16px;height:9px;border:1.5px solid var(--ink);border-radius:3px;display:block;"></span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;padding:34px 32px 38px;box-sizing:border-box;">
          <div style="display:flex;gap:6px;margin-bottom:24px;">
            <span style="width:26px;height:4px;border-radius:2px;background:var(--line);display:block;"></span>
            <span style="width:26px;height:4px;border-radius:2px;background:var(--line);display:block;"></span>
            <span style="width:26px;height:4px;border-radius:2px;background:var(--accent);display:block;"></span>
          </div>
          <h2 style="font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.45;margin:0;">잔소리 없이,<br />알맞은 때에 조용히 짚어드릴게요</h2>
          <p style="margin:12px 0 0;font-size:14.5px;line-height:1.75;color:var(--ink-2);">재촉하지 않아요. 지금 안 해도 괜찮고,<br />놓치지 않게 다음 타이밍에 다시 챙겨드릴게요.</p>

          <div style="margin-top:40px;background:linear-gradient(180deg,#F2EEE5,#E7E1D5);border-radius:28px;padding:26px 18px 28px;">
            <div style="text-align:center;font-size:13px;color:#6E665D;letter-spacing:.06em;">9월 6일 일요일</div>
            <div style="text-align:center;font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-top:2px;color:#2D2622;">9:41</div>
            <div style="margin-top:22px;background:rgba(255,255,255,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:20px;padding:16px 18px;box-shadow:0 8px 20px rgba(70,58,44,.08);">
              <div style="display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3);margin-bottom:8px;">
                <span style="width:16px;height:16px;border-radius:5px;background:var(--accent);display:block;"></span>
                <span style="font-weight:600;color:var(--ink-2);">Lastly</span><span style="margin-left:auto;">지금</span>
              </div>
              <div style="font-size:15px;font-weight:600;margin-bottom:5px;">에어컨 필터 청소할 때가 됐어요</div>
              <div style="font-size:13.5px;color:var(--ink-2);">마지막 청소 45일 전 · 이번 주말 어때요?</div>
            </div>
            <div style="margin-top:10px;background:rgba(255,255,255,.6);border-radius:16px;height:32px;"></div>
          </div>

          <div style="margin-top:auto;">
            <div style="background:#A85F44;color:#FFFFFF;border-radius:20px;height:58px;box-shadow:0 8px 18px rgba(168,95,68,.26);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;">알림 켜기</div>
            <div style="text-align:center;margin-top:18px;font-size:14px;color:var(--ink-3);">나중에 하기</div>
          </div>
        </div>
      </div>
    </div>
</div>
</body>
